# Локальный оверрайд для разработки. docker-compose.override.yml
# подхватывается автоматически поверх docker-compose.yml и открывает порт
# БД на хост-машину, чтобы `npm run dev` (запущенный не в контейнере) мог
# подключиться к Postgres. На продакшен-сервере этот файл использовать
# не нужно — там достаточно одного docker-compose.yml.
services:
  db:
    ports:
      - "5432:5432"
