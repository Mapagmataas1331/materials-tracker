# Локальный оверрайд для разработки. docker-compose.override.yml
# подхватывается автоматически поверх docker-compose.yml и открывает порт
# БД только на localhost, чтобы `npm run dev` (запущенный не в контейнере)
# мог подключиться к Postgres. На сервере можно использовать только
# docker-compose.yml: база останется доступна приложению внутри Docker-сети.
services:
  db:
    ports:
      - "127.0.0.1:5432:5432"
